# BUILT and smoke-tested 2026-10-27 (see docs/upstream_build_log.md). Exact pip freeze: dsrl_upstream.lock.txt.
# Order matters; see dsrl_upstream.md "Verified build recipe". Not a one-shot `conda env create` (manual steps).
name: dsrl_upstream
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - patchelf
  - mesalib
  - glew
  - glfw
  - libgl-devel
  - libegl-devel
  - gcc_linux-64=12    # mujoco-py compile: export CC=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gcc
  - gxx_linux-64=12
  - pip:
      - pip==24.0
      - setuptools==65.7.0
      - wheel==0.38.4
      - Cython==0.29.37
      - numpy==1.26.4           # must be re-pinned LAST (pip upgrades it to 2.0.2 otherwise)
      - torch==2.4.0
      - gym==0.22.0
      - gymnasium==1.1.1        # needed by SB3 fork (>=0.29.1,<1.3)
      - mujoco-py==2.1.2.14
      - mujoco==2.3.7           # for robosuite 1.4.1
      - d4rl==1.1               # --no-deps; skip dm_control/pybullet/mjrl (not needed for can/hopper)
      - robomimic==0.3.0        # --no-deps; skip egl_probe (not needed)
      # robosuite 1.4.1 = git tag v1.4.1 (c848ca8), --no-deps
      - protobuf<5              # wandb 0.17.7 breaks on protobuf 6
      - opencv-python-headless==4.10.0.84   # 5.x needs numpy>=2
      - tensorboard<2.18
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.17.7
      - av==12.3.0
      - einops==0.8.0
      - gdown==5.2.0
      - imageio==2.35.1
      - matplotlib==3.7.5
      - pretty_errors==1.2.25
      - tqdm==4.66.5
      # then --no-deps -e: third_party/dsrl/dppo, third_party/dsrl/stable-baselines3
