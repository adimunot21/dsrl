# SPEC ONLY - never built. Upstream DSRL (third_party/dsrl). See dsrl_upstream.md.
# The upstream README gives only `conda create -n dsrl python=3.9`; the rest comes from dppo/SB3 forks
# (NOT checked out) so versions below are PROPOSED and must be reconciled with dppo/setup.py once fetched.
name: dsrl_upstream
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26.4
  - pip
  - patchelf
  - mesalib
  - glew
  - glfw
  - gcc_linux-64=12    # mujoco-py compiles Cython ext at first import
  - gxx_linux-64=12
  - pip:
      - wheel<0.40        # needed to build gym==0.21/0.22 metadata
      - setuptools<66
      - "Cython<3"        # mujoco-py 2.1.2.14 breaks on Cython 3
      - torch==2.4.0      # proposed (matches lpds); verify against dppo pin
      - gym==0.22.0       # proposed
      - "mujoco-py==2.1.2.14"
      - d4rl              # see hazards: install --no-deps
      - robomimic==0.3.0
      - robosuite==1.4.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.17.7
      # then: pip install -e dppo[robomimic,gym] ; pip install -e stable-baselines3  (from pinned commits)
