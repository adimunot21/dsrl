# SPEC ONLY - never built. Mirrors third_party/lpds/environment.yml (read-only source of truth).
# Needs its OWN env: lpds bundles a package named stable_baselines3 (LP-DS fork) that collides with DSRL's fork.
name: lpds_upstream
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.26.4
  - mesalib
  - glew
  - glfw
  - patchelf
  - tmux
  - ipykernel
  - pinocchio
  - tensorboard
  - pip
  - pip:
      # contents of third_party/lpds/requirements.txt, then `-e third_party/lpds`
      - torch==2.4.0
      - torchvision==0.19.0
      - gym==0.22.0
      - gymnasium==1.1.1
      - d4rl==1.1
      - "mjrl @ git+https://github.com/aravindr93/mjrl.git@3871d93763d3b49c4741e6daeaebbc605fe140dc"
      - mujoco==3.3.5
      - mujoco-py==2.1.2.14
      - dm-control==1.0.31
      - robomimic==0.3.0
      - robosuite==1.4.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.17.7
      - Cython==0.29.37
      # remaining pins (matplotlib 3.7.5, pandas 2.3.2, scipy 1.13.1, h5py, einops, opencv 4.11, etc.) per requirements.txt
